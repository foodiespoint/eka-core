<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EKA Neural Core V2 - Seamless Hands-Free</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-color: #080810;
      --card-bg: #121220;
      --accent-blue: #00d2ff;
      --accent-purple: #9d00ff;
      --accent-green: #00ff87;
      --accent-red: #ff0055;
      --text-main: #f0f4f8;
      --text-sub: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 32, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-sub);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background: rgba(0, 255, 135, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 255, 135, 0.3);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
    }

    .settings-panel {
      padding: 8px 20px;
      background: #0d0d18;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .url-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
    }

    .url-input:focus {
      border-color: var(--accent-blue);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 15px 20px;
      position: relative;
    }

    .orb-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-blue) 0%, var(--accent-purple) 100%);
      box-shadow: 0 0 45px rgba(0, 210, 255, 0.4);
      transition: all 0.3s ease;
      animation: float 4s ease-in-out infinite;
    }

    .orb-ring {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 210, 255, 0.3);
      animation: spin 12s linear infinite;
    }

    /* Reactive States */
    body.state-listening .orb {
      background: radial-gradient(circle, var(--accent-green) 0%, var(--accent-blue) 100%);
      box-shadow: 0 0 70px rgba(0, 255, 135, 0.7);
      transform: scale(1.15);
    }

    body.state-recording .orb {
      background: radial-gradient(circle, #ffaa00 0%, var(--accent-red) 100%);
      box-shadow: 0 0 75px rgba(255, 170, 0, 0.8);
      transform: scale(1.25);
    }

    body.state-thinking .orb {
      background: radial-gradient(circle, var(--accent-purple) 0%, var(--accent-red) 100%);
      box-shadow: 0 0 70px rgba(157, 0, 255, 0.7);
      animation: pulse 0.7s ease-in-out infinite alternate;
    }

    body.state-speaking .orb {
      background: radial-gradient(circle, var(--accent-blue) 0%, var(--accent-green) 100%);
      box-shadow: 0 0 80px rgba(0, 210, 255, 0.85);
      animation: pulse 0.4s ease-in-out infinite alternate;
    }

    body.state-error .orb {
      background: radial-gradient(circle, var(--accent-red) 0%, #330011 100%);
      box-shadow: 0 0 70px rgba(255, 0, 85, 0.8);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }

    .conversation-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      min-height: 45px;
      word-break: break-word;
    }

    .card-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .controls-bar {
      padding: 12px 20px 20px 20px;
      background: #0d0d18;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 24px;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn.primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    }

    .icon-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">EKA AI</span>
    </div>
    <div class="header-actions">
      <button id="autoModeBtn" class="toggle-btn active">
        <span>⚡</span> Hands-Free Mode: ON
      </button>
      <span id="statusBadge" class="status-badge">Standby</span>
    </div>
  </header>

  <div class="settings-panel">
    <input 
      type="url" 
      id="ngrokUrl" 
      class="url-input" 
      placeholder="https://xxxx.ngrok-free.dev/transcribe" 
    />
  </div>

  <main>
    <div class="orb-container">
      <div class="orb-ring"></div>
      <div class="orb"></div>
    </div>

    <div class="conversation-box">
      <div class="card">
        <div class="card-label">You</div>
        <div id="userText">Start speaking naturally or type below...</div>
      </div>
      <div class="card">
        <div class="card-label">EKA Response</div>
        <div id="aiResponse">Awaiting voice or text input...</div>
      </div>
    </div>
  </main>

  <div class="controls-bar">
    <input 
      type="text" 
      id="chatInput" 
      class="chat-input" 
      placeholder="Type a message or paste voice URL..." 
    />
    <button id="sendBtn" class="icon-btn primary">➔</button>
    <button id="micBtn" class="icon-btn">🎙️</button>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const chatInput = document.getElementById('chatInput');
    const userText = document.getElementById('userText');
    const aiResponse = document.getElementById('aiResponse');
    const statusBadge = document.getElementById('statusBadge');
    const ngrokUrlInput = document.getElementById('ngrokUrl');
    const autoModeBtn = document.getElementById('autoModeBtn');

    // System States
    let isAutoMode = true;
    let isProcessing = false;
    let isSpeakingAI = false;
    let isUserTalking = false;

    // VAD & Web Audio
    let audioContext = null;
    let analyser = null;
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let silenceTimer = null;
    let vadInterval = null;

    const SILENCE_THRESHOLD_RMS = 0.025; // Minimum energy level to trigger speech detection
    const SILENCE_WAIT_TIME = 1400;      // Milliseconds of silence to wait before auto-submitting

    const savedUrl = localStorage.getItem('eka_ngrok_url');
    if (savedUrl) ngrokUrlInput.value = savedUrl;

    ngrokUrlInput.addEventListener('change', () => {
      localStorage.setItem('eka_ngrok_url', ngrokUrlInput.value.trim());
    });

    function setAppState(state, badgeText) {
      document.body.className = '';
      if (state) document.body.classList.add(`state-${state}`);
      statusBadge.textContent = badgeText;
    }

    // Toggle Hands-Free Auto Mode
    autoModeBtn.addEventListener('click', () => {
      isAutoMode = !isAutoMode;
      if (isAutoMode) {
        autoModeBtn.classList.add('active');
        autoModeBtn.innerHTML = '<span>⚡</span> Hands-Free Mode: ON';
        startContinuousVAD();
      } else {
        autoModeBtn.classList.remove('active');
        autoModeBtn.innerHTML = '<span>⏸️</span> Hands-Free Mode: OFF';
        stopContinuousVAD();
        setAppState('', 'Standby');
      }
    });

    async function initAudioEngine() {
      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(micStream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
        }
        if (isAutoMode) startContinuousVAD();
      } catch (err) {
        console.error('Microphone initialization failed:', err);
        setAppState('error', 'No Mic');
      }
    }

    // Hands-Free Voice Activity Detection (VAD) Loop
    function startContinuousVAD() {
      if (vadInterval) clearInterval(vadInterval);
      setAppState('listening', 'Listening (Hands-Free)...');

      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      vadInterval = setInterval(() => {
        if (isProcessing || isSpeakingAI) return; // Mute detection while AI is busy

        analyser.getByteTimeDomainData(dataArray);

        // Compute RMS (Volume Energy)
        let sumSquares = 0.0;
        for (let i = 0; i < dataArray.length; i++) {
          const norm = (dataArray[i] - 128) / 128;
          sumSquares += norm * norm;
        }
        const rms = Math.sqrt(sumSquares / dataArray.length);

        // Speech Detected
        if (rms > SILENCE_THRESHOLD_RMS) {
          if (!isUserTalking) {
            isUserTalking = true;
            startActualRecording();
          }
          if (silenceTimer) {
            clearTimeout(silenceTimer);
            silenceTimer = null;
          }
        } 
        // Silence Detected after speech
        else if (isUserTalking && !silenceTimer) {
          silenceTimer = setTimeout(() => {
            stopActualRecordingAndSend();
          }, SILENCE_WAIT_TIME);
        }
      }, 60);
    }

    function stopContinuousVAD() {
      if (vadInterval) clearInterval(vadInterval);
      if (silenceTimer) clearTimeout(silenceTimer);
      isUserTalking = false;
    }

    function startActualRecording() {
      audioChunks = [];
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      mediaRecorder = new MediaRecorder(micStream, { mimeType: mimeType });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        audioChunks = [];
        await sendPayloadToEka({ blob: audioBlob });
      };

      mediaRecorder.start();
      setAppState('recording', 'User Speaking...');
    }

    function stopActualRecordingAndSend() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      isUserTalking = false;
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }
    }

    // Manual Mic Click Fallback
    micBtn.addEventListener('click', async () => {
      await initAudioEngine();
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopActualRecordingAndSend();
      } else {
        startActualRecording();
      }
    });

    // Send Text / Link Handler
    sendBtn.addEventListener('click', handleSendText);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSendText();
    });

    function handleSendText() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      userText.textContent = text;
      sendPayloadToEka({ text: text });
    }

    // Unified Network Sender
    async function sendPayloadToEka({ blob = null, text = null }) {
      const endpoint = ngrokUrlInput.value.trim();
      if (!endpoint) {
        alert('Please enter your active Colab ngrok URL in the settings box.');
        setAppState('', 'Standby');
        return;
      }

      isProcessing = true;
      setAppState('thinking', 'Processing...');

      const formData = new FormData();
      if (blob) {
        const extension = blob.type.includes('mp4') ? 'mp4' : 'webm';
        formData.append('file', blob, `voice.${extension}`);
      }
      if (text) {
        formData.append('text', text);
      }

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'ngrok-skip-browser-warning': 'true' },
          body: formData
        });

        if (!response.ok) throw new Error(`Server status: ${response.status}`);

        const data = await response.json();
        userText.textContent = data.text || text || '(Unclear speech)';
        aiResponse.textContent = data.response || '(No response)';

        if (data.audio) {
          playCustomNeuralAudio(data.audio);
        } else {
          isProcessing = false;
          if (isAutoMode) startContinuousVAD();
        }

      } catch (err) {
        console.error('EKA Fetch Error:', err);
        aiResponse.textContent = `Error: ${err.message}`;
        setAppState('error', 'Error');
        isProcessing = false;
        if (isAutoMode) {
          setTimeout(() => startContinuousVAD(), 2000);
        }
      }
    }

    function playCustomNeuralAudio(base64Audio) {
      isSpeakingAI = true;
      setAppState('speaking', 'EKA Speaking...');
      const audio = new Audio(`data:audio/wav;base64,${base64Audio}`);

      const resumeListening = () => {
        isSpeakingAI = false;
        isProcessing = false;
        if (isAutoMode) {
          startContinuousVAD();
        } else {
          setAppState('', 'Standby');
        }
      };

      audio.onended = resumeListening;
      audio.onerror = resumeListening;

      audio.play().catch(e => {
        console.error('Playback failed:', e);
        resumeListening();
      });
    }

    // Auto-init mic on first click anywhere
    window.addEventListener('click', () => {
      if (!audioContext) initAudioEngine();
    }, { once: true });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
