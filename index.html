<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EKA Neural Core</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-color: #080810;
      --card-bg: #121220;
      --accent-blue: #00d2ff;
      --accent-purple: #9d00ff;
      --accent-green: #00ff87;
      --accent-red: #ff0055;
      --text-main: #f0f4f8;
      --text-sub: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 32, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
    }

    /* Settings Collapsible */
    .settings-panel {
      padding: 12px 20px;
      background: #0d0d18;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .url-input:focus {
      border-color: var(--accent-blue);
    }

    /* Main Display Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px;
      position: relative;
    }

    /* Animated Neural Visualizer */
    .orb-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-blue) 0%, var(--accent-purple) 100%);
      box-shadow: 0 0 50px rgba(0, 210, 255, 0.4);
      transition: all 0.4s ease;
      animation: float 4s ease-in-out infinite;
    }

    .orb-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 210, 255, 0.3);
      animation: spin 12s linear infinite;
    }

    /* State Visual Overrides */
    body.state-listening .orb {
      background: radial-gradient(circle, var(--accent-green) 0%, var(--accent-blue) 100%);
      box-shadow: 0 0 70px rgba(0, 255, 135, 0.6);
      transform: scale(1.15);
    }

    body.state-thinking .orb {
      background: radial-gradient(circle, var(--accent-purple) 0%, var(--accent-red) 100%);
      box-shadow: 0 0 70px rgba(157, 0, 255, 0.6);
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    body.state-speaking .orb {
      background: radial-gradient(circle, var(--accent-blue) 0%, var(--accent-green) 100%);
      box-shadow: 0 0 80px rgba(0, 210, 255, 0.8);
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    /* Keyframe Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }

    /* Response Cards */
    .conversation-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      min-height: 50px;
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    /* Push-to-Talk Mic Control */
    .controls {
      padding: 20px;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .mic-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      font-size: 1.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .mic-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">EKA AI</span>
    </div>
    <span id="statusBadge" class="status-badge">Standby</span>
  </header>

  <div class="settings-panel">
    <input 
      type="url" 
      id="ngrokUrl" 
      class="url-input" 
      placeholder="https://xxxx.ngrok-free.app/transcribe" 
    />
  </div>

  <main>
    <div class="orb-container">
      <div class="orb-ring"></div>
      <div class="orb"></div>
    </div>

    <div class="conversation-box">
      <div class="card">
        <div class="card-label">You Said</div>
        <div id="userText">Tap microphone to speak...</div>
      </div>
      <div class="card">
        <div class="card-label">EKA Response</div>
        <div id="aiResponse">Awaiting voice input...</div>
      </div>
    </div>
  </main>

  <div class="controls">
    <button id="micBtn" class="mic-btn">🎙️</button>
  </div>

  <script>
    // System State Management
    const micBtn = document.getElementById('micBtn');
    const userText = document.getElementById('userText');
    const aiResponse = document.getElementById('aiResponse');
    const statusBadge = document.getElementById('statusBadge');
    const ngrokUrlInput = document.getElementById('ngrokUrl');

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Load saved ngrok URL from LocalStorage
    const savedUrl = localStorage.getItem('eka_ngrok_url');
    if (savedUrl) ngrokUrlInput.value = savedUrl;

    ngrokUrlInput.addEventListener('change', () => {
      localStorage.setItem('eka_ngrok_url', ngrokUrlInput.value.trim());
    });

    function setAppState(state, badgeText) {
      document.body.className = '';
      if (state) document.body.classList.add(`state-${state}`);
      statusBadge.textContent = badgeText;
    }

    // Audio Capture Setup
    async function initRecorder() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        audioChunks = [];
        await sendAudioToEka(audioBlob);
      };
    }

    initRecorder();

    // Push to Talk Toggle
    micBtn.addEventListener('click', () => {
      if (!mediaRecorder) return;

      if (!isRecording) {
        audioChunks = [];
        mediaRecorder.start();
        isRecording = true;
        setAppState('listening', 'Listening...');
        micBtn.textContent = '⏹️';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        setAppState('thinking', 'Processing...');
        micBtn.textContent = '🎙️';
      }
    });

    // Send Audio to Colab Backend Server
    async function sendAudioToEka(blob) {
      const endpoint = ngrokUrlInput.value.trim();
      if (!endpoint) {
        alert('Please enter your active Colab ngrok URL.');
        setAppState('', 'Standby');
        return;
      }

      const formData = new FormData();
      formData.append('file', blob, 'user_voice.wav');

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Backend response error');

        const data = await response.json();
        userText.textContent = data.text || '(Unclear speech)';
        aiResponse.textContent = data.response || '(No response)';

        if (data.response) {
          speakResponse(data.response);
        } else {
          setAppState('', 'Standby');
        }

      } catch (err) {
        console.error(err);
        aiResponse.textContent = 'Connection failed. Check ngrok URL and Colab server status.';
        setAppState('', 'Error');
      }
    }

    // Browser Text-To-Speech Synthesis
    function speakResponse(text) {
      if (!('speechSynthesis' in window)) {
        setAppState('', 'Standby');
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      utterance.onstart = () => setAppState('speaking', 'Speaking...');
      utterance.onend = () => setAppState('', 'Standby');
      utterance.onerror = () => setAppState('', 'Standby');

      window.speechSynthesis.speak(utterance);
    }

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
