<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eka Core v4</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Visible Version Badge */
        .version-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #58a6ff;
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 5px 12px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .status-container {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status-online { color: #3fb950; }
        .status-offline { color: #f85149; }

        .hud-core {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .hud-core.active {
            border-color: #3fb950;
            box-shadow: 0 0 20px rgba(63, 185, 80, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(63, 185, 80, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(63, 185, 80, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(63, 185, 80, 0.4); }
        }

        .transcript-box {
            width: 100%;
            max-width: 400px;
            min-height: 80px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <div class="version-badge">v4.0.0</div>

    <div class="status-container">
        SYSTEM STATUS: <span id="sysStatus" class="status-offline">OFFLINE</span>
    </div>

    <div class="hud-core" id="hudCore">
        <span id="coreIcon">🔴</span>
    </div>

    <div class="transcript-box" id="transcriptBox">
        Tap "Initialize System" to start.
    </div>

    <button id="initBtn" onclick="initializeEka()">Initialize System</button>

    <script>
        // Force register/update Service Worker to clear old cache
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=4').then(reg => {
                reg.update();
            }).catch(() => {});
        }

        const sysStatus = document.getElementById('sysStatus');
        const hudCore = document.getElementById('hudCore');
        const coreIcon = document.getElementById('coreIcon');
        const transcriptBox = document.getElementById('transcriptBox');
        const initBtn = document.getElementById('initBtn');

        // Paste your active ngrok URL from Google Colab output here:
        const ENGINE_URL = "https://jogger-evaluate-reply.ngrok-free.dev/transcribe"; 

        let mediaRecorder;
        let audioChunks = [];
        let isProcessing = false;

        async function initializeEka() {
            transcriptBox.textContent = "Requesting microphone permissions...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                sysStatus.textContent = "ONLINE";
                sysStatus.className = "status-online";
                coreIcon.textContent = "🎙️";
                hudCore.classList.add('active');
                initBtn.style.display = 'none';

                speak("Eka systems online. How can I help you?", () => {
                    startRecordingLoop(stream);
                });

            } catch (error) {
                sysStatus.textContent = "ERROR";
                sysStatus.className = "status-offline";
                coreIcon.textContent = "❌";
                transcriptBox.textContent = "Permission error: " + error.message;
            }
        }

        function speak(text, onComplete) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 0.85;
                utterance.onend = () => { if (onComplete) onComplete(); };
                window.speechSynthesis.speak(utterance);
            } else if (onComplete) {
                onComplete();
            }
        }

        function startRecordingLoop(stream) {
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                if (audioChunks.length === 0 || isProcessing) return;
                isProcessing = true;

                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                audioChunks = [];

                const formData = new FormData();
                formData.append('file', audioBlob, 'speech.webm');

                transcriptBox.textContent = "Processing speech on GPU...";

                try {
                    const res = await fetch(ENGINE_URL, { method: 'POST', body: formData });
                    const data = await res.json();

                    if (data.text && data.text.trim() !== "") {
                        transcriptBox.textContent = `User: "${data.text}"`;
                        processCommand(data.text);
                    } else {
                        transcriptBox.textContent = "Listening...";
                    }
                } catch (err) {
                    transcriptBox.textContent = "Engine Error: Check if Colab server is running.";
                }

                isProcessing = false;
            };

            mediaRecorder.start();
            setInterval(() => {
                if (mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    mediaRecorder.start();
                }
            }, 3000);
        }

        function processCommand(cmdText) {
            const cmd = cmdText.toLowerCase().trim();
            let reply = "";

            // Intelligent responses without repeating "I heard..."
            if (cmd.includes('hello') || cmd.includes('hi') || cmd.includes('hey')) {
                reply = "Hello! I am listening.";
            } else if (cmd.includes('who are you') || cmd.includes('status')) {
                reply = "I am Eka. Your custom cloud neural core.";
            } else if (cmd.includes('time')) {
                reply = "The time is " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } else {
                reply = "Acknowledged: " + cmdText;
            }

            speak(reply);
        }
    </script>
</body>
</html>
